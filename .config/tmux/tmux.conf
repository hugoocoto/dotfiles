set -a terminal-features "tmux-256color:RGB,xterm-256color:RGB,st-256color:RGB"
set -g prefix C-SPACE

set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g mouse on

set -g window-status-current-style "fg=color8"
set -g status-style 'fg=color8 bg=default'
set -g pane-border-style 'fg=color8'
set -g pane-active-border-style 'fg=color8'

set -g status-left "#S"
set -g status-right ""
set -g focus-events on

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind f run-shell "tmux neww ~/.config/tmux/tmux-session-dispensary.sh"
